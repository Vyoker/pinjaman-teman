<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1411">
<title>Pinjaman Teman</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="bg-fx" aria-hidden="true"></div>
<div id="app">
  <header id="topbar" class="hidden">
    <div class="brand">
      <span class="brand-mark"><i class="bi bi-cash-coin"></i></span>
      <span>Pinjaman <em>Teman</em></span>
    </div>
    <div class="topbar-right">
      <span id="userName" class="user-name"></span>
      <button id="btnNotif" class="btn btn-ghost btn-sm hidden" style="position:relative" title="Notifikasi"><i class="bi bi-bell-fill"></i><span id="notifBadge" class="notif-badge hidden"></span></button>
      <button id="btnLogout" class="btn btn-ghost btn-sm"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </header>
  <nav id="nav" class="hidden"></nav>
  <div id="storageWarn" class="hidden">
    <i class="bi bi-exclamation-triangle-fill me-2"></i><span>Mode memori aktif — Vercel KV belum terhubung, data bisa hilang sewaktu-waktu. Hubungkan KV di dashboard Vercel lalu redeploy.</span>
  </div>
  <main id="main" class="container-fluid"></main>
</div>
<div id="toast" class="hidden"></div>
<footer id="footer" class="hidden"><span id="footVer"></span> &middot; &copy; <span id="footYear"></span> Vyoker</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
